<div style="width: 95%; margin: 12px auto;">
<details class="omni-sync-done" style="
    background: linear-gradient(180deg, #0a1422 0%, #050912 100%);
    border: 1px solid #2a4858;
    border-left: 3px solid #4fd97a;
    box-shadow: 0 0 12px rgba(80,217,122,0.15), inset 0 0 20px rgba(0,0,0,0.5);
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
">
    <summary style="padding: 10px 14px; color: #d4dde2; cursor: pointer; list-style: none; font-weight: bold; display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, rgba(80,217,122,0.06) 0%, transparent 100%); font-family: 'Consolas', monospace; letter-spacing: 3px;">
        <span style="color: #4fd97a; font-size: 0.9em; text-shadow: 0 0 8px #4fd97a;">●</span>
        <span style="flex: 1;">〔 OMNI-NEXUS // DATA STREAM 〕</span>
        <span style="font-size: 0.7em; color: #4fd97a; border: 1px solid #4fd97a; padding: 1px 6px; letter-spacing: 1px;">COMPLETE</span>
        <button type="button" data-xy-var-tune title="微调本楼变量（重算 / 一句话修正）" style="font-size: 0.7em; color: #4fd97a; background: rgba(80,217,122,0.08); border: 1px solid #4fd97a; padding: 1px 7px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; font-family: inherit;">⚙ 微调</button>
    </summary>
    <div style="max-height: 250px; overflow-y: auto; padding: 10px 14px; color: #8b9aac; font-size: 0.85em; line-height: 1.6; background: #050912; border-top: 1px solid rgba(42,72,88,0.6); font-family: 'Consolas', monospace;">
        {{CONTENT}}
    </div>
</details></div>
<style>
.omni-sync-done summary::marker { display: none; }
.omni-sync-done summary::-webkit-details-marker { display: none; }
</style>
