<div style="width: 95%; margin: 12px auto;">
<details class="omni-sync-progress" style="
    background: linear-gradient(180deg, #0a1422 0%, #050912 100%);
    border: 1px solid #2a4858;
    border-left: 3px solid #ffc83a;
    box-shadow: 0 0 15px rgba(255,200,58,0.18), inset 0 0 20px rgba(0,0,0,0.5);
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
">
    <summary style="padding: 10px 14px; color: #d4dde2; cursor: pointer; list-style: none; font-weight: bold; display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, rgba(255,200,58,0.06) 0%, transparent 100%); font-family: 'Consolas', monospace; letter-spacing: 3px;">
        <span style="color: #ffc83a; font-size: 1em; animation: omni-pulse 1.5s ease-in-out infinite; text-shadow: 0 0 10px #ffc83a;">▲</span>
        <span style="flex: 1;">〔 OMNI-NEXUS // SYNC IN PROGRESS 〕</span>
        <span style="font-size: 0.7em; color: #ffc83a; border: 1px solid #ffc83a; padding: 1px 6px; letter-spacing: 1px; animation: omni-blink 1s infinite;">PROCESSING</span>
    </summary>
    <div style="max-height: 250px; overflow-y: auto; padding: 10px 14px; color: #8b9aac; font-size: 0.85em; line-height: 1.6; background: #050912; border-top: 1px solid rgba(42,72,88,0.6); font-family: 'Consolas', monospace;">
        {{CONTENT}}
    </div>
</details></div>
<style>
.omni-sync-progress summary::marker { display: none; }
.omni-sync-progress summary::-webkit-details-marker { display: none; }
@keyframes omni-pulse { 0%, 100% { opacity: 1; text-shadow: 0 0 10px #ffc83a; } 50% { opacity: 0.5; text-shadow: 0 0 18px #ffc83a; } }
@keyframes omni-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
