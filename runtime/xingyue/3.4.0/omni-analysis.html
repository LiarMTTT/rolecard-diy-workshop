<div style="width: 95%; margin: 12px auto;">
<details class="omni-analysis" style="
    background: linear-gradient(180deg, #0a1422 0%, #050912 100%);
    border: 1px solid #2a4858;
    border-left: 3px solid #4fd0e6;
    box-shadow: 0 0 12px rgba(79,208,230,0.15), inset 0 0 20px rgba(0,0,0,0.5);
    overflow: hidden;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
">
    <summary style="padding: 10px 14px; color: #d4dde2; cursor: pointer; list-style: none; font-weight: bold; display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, rgba(79,208,230,0.06) 0%, transparent 100%); font-family: 'Consolas', monospace; letter-spacing: 3px;">
        <span style="color: #4fd0e6; font-size: 0.9em; text-shadow: 0 0 8px #4fd0e6;">◆</span>
        <span style="flex: 1;">〔 OMNI-NEXUS // 变量预分析 〕</span>
        <span style="font-size: 0.7em; color: #4fd0e6; border: 1px solid #4fd0e6; padding: 1px 6px; letter-spacing: 1px;">ANALYSIS</span>
        <button type="button" data-xy-analysis-edit title="编辑预分析，再按它重算整楼变量" style="font-size: 0.7em; color: #4fd0e6; background: rgba(79,208,230,0.08); border: 1px solid #4fd0e6; padding: 1px 7px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; font-family: inherit;">✎ 编辑</button>
        <button type="button" data-xy-analysis-reroll title="按当前预分析重算整楼变量（不改正文、不耗历史楼）" style="font-size: 0.7em; color: #4fd0e6; background: rgba(79,208,230,0.08); border: 1px solid #4fd0e6; padding: 1px 7px; letter-spacing: 1px; cursor: pointer; border-radius: 3px; font-family: inherit;">⟳ 重roll</button>
    </summary>
    <div style="max-height: 250px; overflow-y: auto; padding: 10px 14px; color: #8b9aac; font-size: 0.85em; line-height: 1.6; background: #050912; border-top: 1px solid rgba(42,72,88,0.6); font-family: 'Consolas', monospace; white-space: pre-wrap; word-break: break-word;">
        {{CONTENT}}
    </div>
</details></div>
<style>
.omni-analysis summary::marker { display: none; }
.omni-analysis summary::-webkit-details-marker { display: none; }
</style>
