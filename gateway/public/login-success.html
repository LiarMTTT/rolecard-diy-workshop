<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录成功 · 创意工坊</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; background: #0d0a07; color: #e4d6c3; }
  .card { width: min(440px, 90vw); padding: 30px 26px; text-align: center; border: 1px solid rgba(224,178,123,.28); border-radius: 14px; background: linear-gradient(180deg, rgba(26,17,10,.72), rgba(13,9,6,.6)); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .ok { font-size: 42px; line-height: 1; color: #c8b07a; }
  h1 { font-size: 19px; margin: 10px 0 8px; color: #efc785; }
  p { font-size: 14px; line-height: 1.65; margin: 6px 0; color: #cdbfa9; }
  .count { font-size: 13px; color: #8a7d6a; margin-top: 14px; min-height: 1.2em; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(224,178,123,.35); }
  .primary { color: #1a120a; font-weight: 700; border-color: rgba(200,176,122,.7); background: linear-gradient(135deg, #d8be86, #c8b07a); }
  .ghost { color: #cdbfa9; background: rgba(255,255,255,.05); }
</style>
</head>
<body>
  <div class="card">
    <div class="ok" id="icon">✓</div>
    <h1 id="title">登录成功</h1>
    <p id="msg">正在把登录状态送回开局页…</p>
    <div class="count" id="count"></div>
    <div class="row">
      <button class="primary" id="back">立即返回星月</button>
      <button class="ghost" id="stay">留在此页</button>
    </div>
  </div>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var hash = String(location.hash || '').replace(/^#/, '');
      var token = '', ret = '', name = '', avatar = '', handoff = '';
      try { var p = new URLSearchParams(hash); token = p.get('token') || ''; ret = p.get('return') || ''; name = p.get('name') || ''; avatar = p.get('avatar') || ''; handoff = p.get('handoff') || ''; } catch (e) {}
      // 立即抹掉地址栏里的 token/return/handoff，避免泄漏到历史记录
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      // 只接受本地 ST 的返回地址（防开放重定向）
      var safeReturn = '';
      try { if (ret && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(ret)) safeReturn = ret; } catch (e) {}

      if (!token && !handoff) {
        $('icon').textContent = '!';
        $('title').textContent = '登录状态异常';
        $('msg').textContent = '未拿到登录凭证，请回到开局页重新登录。';
        $('count').textContent = '';
        $('stay').style.display = 'none';
        if (!safeReturn) $('back').style.display = 'none';
      } else {
        // 只向精确本地 return origin 回传；新版只发完成信号，Bearer 由持私密 secret 的卡片领取。
        var hasOpener = false;
        try {
          if (safeReturn && window.opener && !window.opener.closed) {
            var message = handoff
              ? { type: 'xy-workshop-handoff-ready', handoffId: handoff }
              : { type: 'xy-workshop-token', token: token, name: name, avatar: avatar };
            window.opener.postMessage(message, safeReturn);
            hasOpener = true;
          }
        } catch (e) {}
        // 仅旧版同源 Web 工作台保留 token 兜底；新版 handoff 不把 token 放在页面。
        try { if (token) localStorage.setItem('xingyue-workshop-token', token); } catch (e) {}
        $('msg').textContent = hasOpener ? '登录状态已送回开局页。' : (safeReturn ? '登录成功，即将返回星月开局页。' : '登录成功，请关闭本窗口返回开局页。');
      }

      function doReturn() {
        // #5b：弹窗一律优先自关。OAuth 跨域链常因 COOP 切断 window.opener，但脚本打开的弹窗多数浏览器仍允许 window.close()。
        // 卡片通过一次性交接领取登录态，弹窗本质只需关掉自己——绝不在弹窗里 location.replace 另开一个 ST。
        try { if (window.opener && !window.opener.closed) { try { window.opener.focus(); } catch (e) {} } } catch (e) {}
        try { window.close(); } catch (e) {}
        // 关不掉才处理：真·独立页(非弹窗，如同源 Web 工作台)回跳本地 ST；普通弹窗提示手动关闭。
        setTimeout(function () {
          if (!window.opener && safeReturn) { try { location.replace(safeReturn); return; } catch (e) {} }
          $('count').textContent = '若窗口未自动关闭，请手动关闭本窗口返回星月开局页。';
        }, 350);
      }

      var canAuto = (token || handoff) && (window.opener || safeReturn);
      var left = 3;
      var timer = null;
      function tick() {
        $('count').textContent = left + ' 秒后自动' + (window.opener ? '关闭并返回' : '返回') + '星月…';
        if (left <= 0) { clearInterval(timer); doReturn(); return; }
        left -= 1;
      }
      if (canAuto) { tick(); timer = setInterval(tick, 1000); }
      else { $('count').textContent = ''; }

      $('back').addEventListener('click', function () { if (timer) clearInterval(timer); doReturn(); });
      $('stay').addEventListener('click', function () { if (timer) clearInterval(timer); $('count').textContent = '已停留。可手动关闭本窗口或点「立即返回星月」。'; });
    })();
  </script>
</body>
</html>
